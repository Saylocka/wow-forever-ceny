name: collect
on:
  schedule:
    - cron: "7 * * * *"   # kazdou hodinu
  workflow_dispatch:
permissions:
  contents: write
concurrency: collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 collect.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -q -m "scan $(date -u '+%F %H:%M')" && git push -q)
